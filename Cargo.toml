[workspace]
members = [
    "example",
    "example_modular",
    "example_modular/api",
    "example_modular/layers",
    "example_modular/model",
    "nano-rs",
    "nano-rs-build",
    "nano-rs-core",
    "nano-rs-extra",
    "nano-rs-macro",
    "nano-rs-proc-macro-route",
]
resolver = "3"

[workspace.dependencies]
anyhow = { version = "1.0.102", features = ["backtrace"] }
axum = { version = "0.8.9" }
axum-client-ip = "1.3.1"
bytes = "1.11.1"
clap = { version = "4.6.1", features = ["derive"] }
etcd-client = "0.14.0"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
log = "0.4.29"
mime = "0.3.17"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.27"
time = { version = "0.3.47", features = ["macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tonic = "0.12.2"
tower = { version = "0.5.3", features = ["filter", "util"] }
tower-http = { version = "0.6.10", features = ["full"] }
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-opentelemetry-instrumentation-sdk = "0.32.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
