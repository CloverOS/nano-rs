[workspace]
members = [
    "example",
    "example_modular",
    "example_modular/api",
    "example_modular/layers",
    "example_modular/model",
    "nano-rs",
    "nano-rs-build",
    "nano-rs-core",
    "nano-rs-extra",
    "nano-rs-macro",
    "nano-rs-proc-macro-route",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9" }
axum-client-ip = "1.3.1"
bytes = "1.12.1"
clap = { version = "4.6.4", features = ["derive"] }
http-body-util = "0.1.4"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.27"
time = { version = "0.3.54", features = ["macros"] }
tokio = "1.53.1"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
uuid = { version = "1.24.0", features = ["v4"] }
